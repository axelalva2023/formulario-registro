<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/estilos.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Formulario agregar un producto:</title>
</head>
<body>
    <main>
        <section class="contacto">
            <h1>FORMULARIO DE REGISTRO</h1>
            <div class="contenedor-global">
            <div>
                <form>
                    <label for="nombre">Ingrese su nombre:</label><input type="text" id="nombre" name="nombre">
                    <label for="precio">Especifique el tipo de contenido que quiere recibir:</label><input type="text" id="precio" name="precio">
                    <label for="imagen">Ingrese su edad:</label><input type="number" id="imagen" name="imagen">
                    <label for="categoria">Pose favorita en la cama:</label><input type="text" name="categoria" id="categoria">
                    <input type="submit">
                </form>
            </div>
            </div>
        </section>
    </main>
    

    <script src="./js/formulario.js"></script>
</body>
</html>
